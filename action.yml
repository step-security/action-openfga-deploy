name: OpenFGA Model Deploy Action
description: Github Action for deploying your Authorization Model to an OpenFGA Store
branding:
  icon: align-center
  color: green

inputs:
  api-url:
    description: The OpenFGA server to import the Authorization Model into
    required: true
  store-id:
    description: The store to import the Authorization Model into
    required: true
  api-token:
    description: When using pre-shared key auth, specify the shared secret to use for the request
    required: false
  api-token-issuer:
    description: When using client credentials auth, specify the token issuer to use for the request
    required: false
  client-id:
    description: When using client credentials auth, specify the client ID to use for the request
    required: false
  client-secret:
    description: When using client credentials auth, specify the client secret to use for the request
    required: false
  api-audience:
    description: When using client credentials auth, specify an API audience to use for the request
    required: false
  api-scopes:
    description: When using client credentials auth, specify the API scopes to use for the request
    required: false
  model:
    description: The model to be imported into. The characters should be escaped. The value from here will be used if model-file-path is empty
    required: false
    type: string
    default: ''
  model-file-path:
    description: The file path of the model to be imported
    required: false
  format:
    description: Authorization model input format. Can be "fga" or "json", defaults to auto-detecting from the file extension
    required: false
  fga_cli_version:
    description: 'Version tag of openfga/cli to use'
    required: false
    default: latest

outputs:
  authorization_model_id:
    description: The ID of the deployed Authorization Model
    value: ${{ steps.deploy.outputs.authorization_model_id }}

runs:
  using: composite
  steps:
    - name: Subscription check
      env:
        REPO_PRIVATE: ${{ github.event.repository.private }}
      run: |
        UPSTREAM="openfga/action-openfga-deploy"
        ACTION_REPO="${GITHUB_ACTION_REPOSITORY:-}"
        DOCS_URL="https://docs.stepsecurity.io/actions/stepsecurity-maintained-actions"

        echo ""
        echo -e "\033[1;36mStepSecurity Maintained Action\033[0m"
        echo "Secure drop-in replacement for $UPSTREAM"
        if [ "$REPO_PRIVATE" = "false" ]; then
          echo -e "\033[32m✓ Free for public repositories\033[0m"
        fi
        echo -e "\033[36mLearn more:\033[0m $DOCS_URL"
        echo ""

        if [ "$REPO_PRIVATE" != "false" ]; then
          SERVER_URL="${GITHUB_SERVER_URL:-https://github.com}"

          if [ "$SERVER_URL" != "https://github.com" ]; then
            BODY=$(printf '{"action":"%s","ghes_server":"%s"}' "$ACTION_REPO" "$SERVER_URL")
          else
            BODY=$(printf '{"action":"%s"}' "$ACTION_REPO")
          fi

          API_URL="https://agent.api.stepsecurity.io/v1/github/$GITHUB_REPOSITORY/actions/maintained-actions-subscription"

          RESPONSE=$(curl --max-time 3 -s -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -d "$BODY" \
            "$API_URL" -o /dev/null) && CURL_EXIT_CODE=0 || CURL_EXIT_CODE=$?

          if [ $CURL_EXIT_CODE -ne 0 ]; then
            echo "Timeout or API not reachable. Continuing to next step."
          elif [ "$RESPONSE" = "403" ]; then
            echo -e "::error::\033[1;31mThis action requires a StepSecurity subscription for private repositories.\033[0m"
            echo -e "::error::\033[31mLearn how to enable a subscription: $DOCS_URL\033[0m"
            exit 1
          fi
        fi
      shell: bash

    - name: Resolve CLI version and checksum
      id: resolve-cli
      shell: bash
      env:
        INPUT_FGA_CLI_VERSION: ${{ inputs.fga_cli_version }}
      run: |
        if [ "$INPUT_FGA_CLI_VERSION" == "latest" ]; then
          VERSION=$(curl -s https://api.github.com/repos/openfga/cli/releases/latest | jq -r '.tag_name')
        else
          VERSION="$INPUT_FGA_CLI_VERSION"
        fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

        curl -sL "https://github.com/openfga/cli/releases/download/${VERSION}/checksums.txt" -o checksums.txt

        OS=$(uname -s | tr '[:upper:]' '[:lower:]')
        ARCH=$(uname -m)
        case "$ARCH" in
          x86_64) ARCH="amd64" ;;
          aarch64|arm64) ARCH="arm64" ;;
          i386|i686) ARCH="386" ;;
        esac

        VERSION_NUM="${VERSION#v}"
        ARCHIVE="fga_${VERSION_NUM}_${OS}_${ARCH}.tar.gz"
        CHECKSUM=$(grep "  ${ARCHIVE}$" checksums.txt | awk '{print $1}')

        if [ -z "$CHECKSUM" ]; then
          echo "::error::Could not find checksum for ${ARCHIVE}"
          exit 1
        fi

        echo "digest=${CHECKSUM}" >> "$GITHUB_OUTPUT"

    - name: Install OpenFGA CLI
      uses: step-security/action-install-gh-release@671c3094a3d5dcd2870460d0507b99841597d12b #v2.1.0
      with:
        repo: openfga/cli
        tag: ${{ steps.resolve-cli.outputs.version }}
        cache: enable
        digest: ${{ steps.resolve-cli.outputs.digest }}

    - name: Install JQ
      uses: step-security/install-jq-action@fd50feb4e8cd2b0e1e72df42db468e62c71d58f4 #v3.2.0

    - name: Mask secrets
      shell: bash
      env:
        INPUT_API_TOKEN: ${{ inputs.api-token }}
        INPUT_CLIENT_SECRET: ${{ inputs.client-secret }}
      run: |
        if [ -n "$INPUT_API_TOKEN" ]
        then
          echo "::add-mask::$INPUT_API_TOKEN"
        fi
        if [ -n "$INPUT_CLIENT_SECRET" ]
        then
          echo "::add-mask::$INPUT_CLIENT_SECRET"
        fi

    - name: Prepare deployment
      id: prepare
      shell: bash
      env:
        INPUT_STORE_ID: ${{ inputs.store-id }}
        INPUT_API_AUDIENCE: ${{ inputs.api-audience }}
        INPUT_API_SCOPES: ${{ inputs.api-scopes }}
        INPUT_API_TOKEN_ISSUER: ${{ inputs.api-token-issuer }}
        INPUT_API_URL: ${{ inputs.api-url }}
        INPUT_CLIENT_ID: ${{ inputs.client-id }}
        INPUT_MODEL_FILE_PATH: ${{ inputs.model-file-path }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_MODEL: ${{ inputs.model }}
      run: |
        fga_deploy_params="--store-id=$INPUT_STORE_ID"

        if [ -n "$INPUT_API_AUDIENCE" ]
        then
          fga_deploy_params+=" --api-audience=$INPUT_API_AUDIENCE"
        fi

        if [ -n "$INPUT_API_SCOPES" ]
        then
          fga_deploy_params+=" --api-scopes=$INPUT_API_SCOPES"
        fi

        if [ -n "$INPUT_API_TOKEN_ISSUER" ]
        then
          fga_deploy_params+=" --api-token-issuer=$INPUT_API_TOKEN_ISSUER"
        fi

        if [ -n "$INPUT_API_URL" ]
        then
          fga_deploy_params+=" --api-url=$INPUT_API_URL"
        fi

        if [ -n "$INPUT_CLIENT_ID" ]
        then
          fga_deploy_params+=" --client-id=$INPUT_CLIENT_ID"
        fi

        if [ -n "$INPUT_MODEL_FILE_PATH" ]
        then
          fga_deploy_params+=" --file=$INPUT_MODEL_FILE_PATH"
        else
          fga_deploy_params+=" --format=$INPUT_FORMAT"

          if [ "$INPUT_FORMAT" == "json" ]
          then
            read json <<< "$INPUT_MODEL"
            json=$( echo -n "$json" | jq -crRsa . )
            fga_deploy_params+=" $json"
          else
            fga_deploy_params+=" $INPUT_MODEL"
          fi
        fi

        echo "fga_deploy_params=$fga_deploy_params" >> "$GITHUB_OUTPUT"

    - name: Deploy
      id: deploy
      shell: bash
      env:
        FGA_API_TOKEN: ${{ inputs.api-token }}
        FGA_CLIENT_SECRET: ${{ inputs.client-secret }}
      run: |
        fga_output=$(fga model write ${{ steps.prepare.outputs.fga_deploy_params }})
        echo "$fga_output"

        authorization_model_id=$(echo "$fga_output" | jq -r '.authorization_model_id')
        echo "authorization_model_id=${authorization_model_id}"

        echo "authorization_model_id=${authorization_model_id}" >> "$GITHUB_OUTPUT"
        echo "fga_deploy_output=$fga_output" >> "$GITHUB_OUTPUT"
